.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  (() =&gt; {
    const root = document.getElementById(&#x27;target-vocab-tim&#x27;);
    const el = id =&gt; root.querySelector(&#x27;#tv-&#x27; + id);
    const cards = JSON.parse(el(&#x27;data&#x27;).textContent).map((c, id) =&gt; ({...c, id}));
    const hard = new Set();
    let deck = [...cards], index = 0, flipped = false;
    function render() {
      const c = deck[index];
      el(&#x27;count&#x27;).textContent = (c ? `${index + 1} / ${deck.length}` : &#x27;0 карточек&#x27;) + ` · Трудных: ${hard.size}`;
      [&#x27;card&#x27;, &#x27;prev&#x27;, &#x27;next&#x27;, &#x27;hard&#x27;].forEach(id =&gt; el(id).disabled = !c);
      el(&#x27;translation&#x27;).hidden = !flipped || !c;
      if (!c) {
        el(&#x27;section&#x27;).textContent = &#x27;&#x27;;
        el(&#x27;main&#x27;).textContent = &#x27;В этом наборе пока нет трудных карточек.&#x27;;
        el(&#x27;hint&#x27;).textContent = &#x27;Сними отметку «Только трудные», чтобы продолжить.&#x27;;
        return;
      }
      const reverse = el(&#x27;mode&#x27;).value === &#x27;definition&#x27;;
      el(&#x27;card&#x27;).classList.toggle(&#x27;definition&#x27;, flipped ? !reverse : reverse);
      el(&#x27;section&#x27;).textContent = `Unit ${c.section}`;
      el(&#x27;main&#x27;).textContent = flipped ? (reverse ? c.word : c.explanation) : (reverse ? c.explanation : c.word);
      el(&#x27;translation&#x27;).textContent = c.translation;
      el(&#x27;hint&#x27;).textContent = flipped ? &#x27;Нажми, чтобы скрыть ответ&#x27; : &#x27;Нажми, чтобы проверить себя&#x27;;
      el(&#x27;hard&#x27;).textContent = hard.has(c.id) ? &#x27;✓ Трудная · убрать&#x27; : &#x27;Отметить трудной&#x27;;
      el(&#x27;hard&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(hard.has(c.id)));
      el(&#x27;card&#x27;).setAttribute(&#x27;aria-label&#x27;, (flipped ? &#x27;Скрыть ответ: &#x27; : &#x27;Показать ответ: &#x27;) + el(&#x27;main&#x27;).textContent);
    }
    function filter() {
      const unit = el(&#x27;unit&#x27;).value;
      deck = cards.filter(c =&gt; (unit === &#x27;all&#x27; || c.section.startsWith(unit)) &amp;&amp; (!el(&#x27;only&#x27;).checked || hard.has(c.id)));
      index = 0; flipped = false; render();
    }
    el(&#x27;unit&#x27;).onchange = filter;
    el(&#x27;only&#x27;).onchange = filter;
    el(&#x27;mode&#x27;).onchange = () =&gt; {flipped = false; render();};
    el(&#x27;card&#x27;).onclick = () =&gt; {flipped = !flipped; render();};
    el(&#x27;next&#x27;).onclick = () =&gt; {index = (index + 1) % deck.length; flipped = false; render();};
    el(&#x27;prev&#x27;).onclick = () =&gt; {index = (index + deck.length - 1) % deck.length; flipped = false; render();};
    el(&#x27;shuffle&#x27;).onclick = () =&gt; {
      for (let i = deck.length - 1; i &gt; 0; i--) {const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]];}
      index = 0; flipped = false; render();
    };
    el(&#x27;hard&#x27;).onclick = () =&gt; {
      const id = deck[index].id;
      hard.has(id) ? hard.delete(id) : hard.add(id);
      if (el(&#x27;only&#x27;).checked) {deck = deck.filter(c =&gt; hard.has(c.id)); index = Math.min(index, Math.max(0, deck.length - 1)); flipped = false;}
      render();
    };
    render();
  })();
